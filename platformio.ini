; cardputerOS — M5Stack Cardputer ADV + external 2.8" ILI9341
[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 115200
upload_flags = --no-stub
monitor_filters = esp32_exception_decoder
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_LOOP_STACK_SIZE=16384
    -std=gnu++17
build_unflags = -std=gnu++11
lib_deps =
    m5stack/M5Cardputer@^1.1.0
    m5stack/M5Unified
    m5stack/M5GFX
    ewpa/LibSSH-ESP32@^5.7.0
    h2zero/NimBLE-Arduino@^1.4.3
test_ignore = *

; Host-side unit tests for the portable libraries (terminal emulator etc.)
[env:native]
platform = native
build_flags = -std=gnu++17 -g -fsanitize=address,undefined -Wall
build_src_filter = -<*>
test_framework = unity
lib_deps =
lib_compat_mode = off
test_ignore =
